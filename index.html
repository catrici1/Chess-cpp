<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chess GUI</title>
<style>
  body { margin: 0; display: flex; gap: 16px; padding: 16px; font-family: sans-serif; }
  #left { flex: none; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #board { display: grid; grid-template-columns: 20px repeat(8, 56px); grid-template-rows: repeat(8, 56px) 20px; }
  .lbl { display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .sq { display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; user-select: none; }
  .light { background: #f0d9b5; }
  .dark { background: #b58863; }
  .sel { outline: 3px solid #e33; outline-offset: -3px; }
  #term { flex: 1; height: 70vh; margin: 0; padding: 8px; overflow: auto; background: #111; color: #ddd;
          font: 14px/1.2 monospace; white-space: pre-wrap; }
  #status { color: #c33; font-weight: bold; min-height: 1.2em; }
  #picker { margin: 8px 0; }
  form { display: flex; gap: 8px; margin-top: 8px; }
  form input { flex: 1; font: 14px monospace; }
</style>
</head>
<body>
<div id="left">
  <div id="board"></div>
  <p><button id="newgame">New game</button></p>
  <div id="picker" hidden>Promote to:
    <button data-p="queen">queen</button> <button data-p="rook">rook</button>
    <button data-p="knight">knight</button> <button data-p="bishop">bishop</button>
  </div>
</div>
<div id="right">
  <pre id="term"></pre>
  <div id="status"></div>
  <form id="form"><input id="cmd" autocomplete="off" placeholder="type raw input, e.g. e2e4"><button>Send</button></form>
</div>

<script>
const GLYPH = { K:"♔", Q:"♕", R:"♖", B:"♗", N:"♘", P:"♙", k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };
const HEADER = "  a b c d e f g h";
const ROW = /^([1-8]) ((?:[rnbqkpRNBQKP.] ){8})\1$/;

let text = "", exited = false, sel = null, board = null;
const $ = id => document.getElementById(id);

// Find the last complete board (header + 8 rows) in the output.
function parseBoard(t) {
  const lines = t.replace(/\r/g, "").split("\n").map(l => l.trimEnd());
  for (let i = lines.length - 9; i >= 0; i--) {
    if (lines[i] !== HEADER) continue;
    const rows = [];
    for (let k = 1; k <= 8; k++) {
      const m = ROW.exec(lines[i + k]);
      if (!m) break;
      rows.push(m[2].trim().split(" "));
    }
    if (rows.length === 8) return rows;
  }
  return null;
}

const myTurn = () => !exited && text.endsWith("White's move: ");
const promoting = () => !exited && text.trimEnd().endsWith("'rook'.");

function send(s) { fetch("/send", { method: "POST", body: s }); }

function render() {
  const b = $("board");
  b.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    const l = document.createElement("div");
    l.className = "lbl"; l.textContent = 8 - r; b.appendChild(l);
    for (let c = 0; c < 8; c++) {
      const d = document.createElement("div");
      const p = board ? board[r][c] : ".";
      d.className = "sq " + ((r + c) % 2 ? "dark" : "light") + (sel && sel.r === r && sel.c === c ? " sel" : "");
      d.dataset.sq = "abcdefgh"[c] + (8 - r);
      d.textContent = GLYPH[p] || "";
      d.onclick = () => clickSq(r, c);
      b.appendChild(d);
    }
  }
  b.appendChild(document.createElement("div"));
  for (const f of "abcdefgh") { const l = document.createElement("div"); l.className = "lbl"; l.textContent = f; b.appendChild(l); }
}

function clickSq(r, c) {
  if (!myTurn() || !board) return;
  const p = board[r][c], sq = "abcdefgh"[c] + (8 - r);
  const own = /[A-Z]/.test(p);
  if (!sel) { if (own) { sel = { r, c }; render(); } return; }
  if (sel.r === r && sel.c === c) { sel = null; render(); return; }
  if (own) { sel = { r, c }; render(); return; }
  const from = "abcdefgh"[sel.c] + (8 - sel.r);
  let mv = from + sq;
  if (board[sel.r][sel.c] === "K" && from === "e1" && sq === "g1") mv = "O.O";
  if (board[sel.r][sel.c] === "K" && from === "e1" && sq === "c1") mv = "O.O.O";
  sel = null;
  send(mv);
  render();
}

function update() {
  const term = $("term");
  term.textContent = text;
  term.scrollTop = term.scrollHeight;
  board = parseBoard(text);
  if (!myTurn()) sel = null;
  $("picker").hidden = !promoting();
  $("status").textContent = exited ? "Game over: the program has exited." : "";
  render();
}

const es = new EventSource("/events");
es.onmessage = e => { text += JSON.parse(e.data); update(); };
es.addEventListener("reset", () => { text = ""; exited = false; sel = null; update(); });
es.addEventListener("exit", () => { exited = true; update(); });

$("newgame").onclick = () => fetch("/new", { method: "POST" });
$("picker").onclick = e => { if (e.target.dataset.p) send(e.target.dataset.p); };
$("form").onsubmit = e => { e.preventDefault(); send($("cmd").value); $("cmd").value = ""; };
render();
</script>
</body>
</html>
